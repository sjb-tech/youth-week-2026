<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Youth Anniversary poster">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1d4f"/>
      <stop offset="45%" stop-color="#0c4c9a"/>
      <stop offset="100%" stop-color="#0d2d72"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#f4f0ff" stop-opacity="1"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#d7d7ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d2d72" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strip" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb24d"/>
      <stop offset="100%" stop-color="#f16620"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="510" cy="260" rx="420" ry="300" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="510" cy="340" rx="190" ry="160" fill="#fefaf7" opacity="0.18"/>

  <g transform="translate(70 40)">
    <circle cx="100" cy="88" r="76" fill="#0d2f6d" stroke="#f8f8ff" stroke-width="8"/>
    <circle cx="100" cy="88" r="60" fill="none" stroke="#f8f8ff" stroke-width="7" stroke-dasharray="2 12"/>
    <g fill="#fff">
      <path d="M100 44 L120 86 L82 86 Z"/>
      <rect x="95" y="86" width="10" height="42" rx="4"/>
      <rect x="72" y="94" width="56" height="8" rx="4"/>
      <circle cx="100" cy="68" r="12"/>
    </g>
  </g>

  <g fill="#f6f2ea" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="610" y="115" font-size="34" font-weight="700">CHRIST APOSTOLIC MISSION CHURCH</text>
    <text x="610" y="152" font-size="26" font-weight="700">[OKE IGBALA] GOD'S GLORY PARISH</text>
  </g>

  <g>
    <text x="512" y="280" text-anchor="middle" fill="#fff5e7" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" letter-spacing="2">PRESENTS</text>
    <g transform="translate(176 300)">
      <path d="M108 80 L180 0 L250 80" fill="none" stroke="#f6f8ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="180" cy="30" r="20" fill="#f1f3ff" opacity="0.9"/>
      <g fill="#f6f8ff" opacity="0.96">
        <path d="M188 86c-27 0-45 18-45 52v18h90v-18c0-34-18-52-45-52z"/>
      </g>
    </g>
    <text x="520" y="420" text-anchor="middle" fill="#f4c83f" font-family="Arial Black, Arial, sans-serif" font-size="190" font-weight="900" letter-spacing="-8">YOUTH</text>
    <text x="520" y="625" text-anchor="middle" fill="#f4c83f" font-family="Arial Black, Arial, sans-serif" font-size="180" font-weight="900" letter-spacing="-8">ANNIVERSARY</text>
  </g>

  <g>
    <rect x="160" y="680" width="704" height="104" rx="18" fill="#e9e9e5" opacity="0.95"/>
    <text x="310" y="720" fill="#0d3a7d" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" font-style="italic">Theme:</text>
    <text x="600" y="720" text-anchor="middle" fill="#0d3a7d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">NEW BEGINNING</text>
    <text x="610" y="760" text-anchor="middle" fill="#0d3a7d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">“Behold, I will do a new thing”</text>
    <text x="610" y="794" text-anchor="middle" fill="#0d3a7d" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Isaiah 43:19</text>
  </g>

  <g>
    <rect x="170" y="825" width="684" height="82" fill="url(#strip)"/>
    <text x="512" y="875" text-anchor="middle" fill="#fff" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1">SEPT, 27TH - OCT, 4TH 2026</text>
  </g>

  <g fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif">
    <text x="512" y="930" text-anchor="middle" font-size="26" font-weight="700" fill="#f1e8ff">Come and experience Jesus!!!</text>
  </g>
</svg>
