<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2b73">
  <title>Youth Anniversary 2026 | I Will Be Attending</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: #fff; background: linear-gradient(135deg,#071b4c,#123f9b); padding: 24px 14px 40px; }
    main { width: min(100%, 720px); margin: auto; text-align: center; }
    h1 { margin: 8px 0; font-size: clamp(1.5rem, 5vw, 2.4rem); }
    .intro { margin: 0 auto 20px; color: #dce8ff; }
    .card { background: rgba(4,18,56,.8); border: 1px solid rgba(255,255,255,.2); border-radius: 18px; padding: 18px; box-shadow: 0 18px 45px #0006; }
    .canvas-wrap { width: min(100%, 560px); margin: 0 auto 18px; background: #061c52; border-radius: 12px; overflow: hidden; }
    canvas { display: block; width: 100%; height: auto; }
    .controls { display: grid; gap: 12px; }
    input[type=file] { width: 100%; padding: 12px; border-radius: 9px; background: #fff; color: #122; font-size: 1rem; }
    button { border: 0; border-radius: 9px; padding: 13px 18px; background: #f7941d; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:hover { background: #ffad3d; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hint { color: #c7d7f9; font-size: .9rem; margin: 2px 0 0; }
    .status { min-height: 1.3em; color: #ffe08a; }
  </style>
</head>
<body>
  <main>
    <h1>Youth Anniversary 2026</h1>
    <p class="intro">Create and download your <strong>“I Will Be Attending”</strong> badge.</p>
    <section class="card">
      <div class="canvas-wrap"><canvas id="badge" width="1024" height="1024" aria-label="Your attendance badge"></canvas></div>
      <div class="controls">
        <label for="photo">Upload your photo</label>
        <input id="photo" type="file" accept="image/*">
        <button id="download" type="button" disabled>Download My Badge</button>
        <p class="hint">Your photo is processed in your browser and is not uploaded to a server.</p>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>
  </main>
  <script>
    const canvas = document.querySelector('#badge');
    const ctx = canvas.getContext('2d');
    const input = document.querySelector('#photo');
    const download = document.querySelector('#download');
    const status = document.querySelector('#status');
    const poster = new Image();
    poster.src = 'youth-anniversary-poster.jpg';
    let userImage = null;

    function cover(image, x, y, w, h) {
      const scale = Math.max(w / image.width, h / image.height);
      const sw = w / scale, sh = h / scale;
      ctx.drawImage(image, (image.width - sw) / 2, (image.height - sh) / 2, sw, sh, x, y, w, h);
    }
    function drawBadge() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (poster.complete && poster.naturalWidth) cover(poster, 0, 0, canvas.width, canvas.height);
      else { ctx.fillStyle = '#123f9b'; ctx.fillRect(0, 0, 1024, 1024); }
      if (userImage) {
        // A photo panel is placed over the less-busy top section of the poster.
        const x = 312, y = 72, size = 400;
        ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, size, size, 28); ctx.clip(); cover(userImage, x, y, size, size); ctx.restore();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.strokeRect(x, y, size, size);
        ctx.fillStyle = 'rgba(5,20,65,.9)'; ctx.fillRect(190, 475, 644, 94);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 48px Arial'; ctx.fillText('I WILL BE ATTENDING', 512, 537);
      }
    }
    poster.onload = drawBadge; drawBadge();
    input.addEventListener('change', () => {
      const file = input.files[0]; if (!file) return;
      if (!file.type.startsWith('image/')) { status.textContent = 'Please choose an image file.'; return; }
      const reader = new FileReader();
      reader.onload = e => { userImage = new Image(); userImage.onload = () => { drawBadge(); download.disabled = false; status.textContent = 'Your badge is ready.'; }; userImage.src = e.target.result; };
      reader.readAsDataURL(file);
    });
    download.addEventListener('click', () => {
      const link = document.createElement('a'); link.download = 'my-youth-week-attendance-badge.png'; link.href = canvas.toDataURL('image/png'); link.click();
    });
  </script>
</body>
</html>
