<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youth Anniversary 2026 | I Will Be Attending</title>
    <meta name="description" content="Youth Anniversary 2026 attendance badge generator." />
    <style>
      :root {
        --bg1: #061e4d;
        --bg2: #0b3d93;
        --orange: #f59b2b;
        --orange-strong: #f16523;
        --white: #ffffff;
        --soft: #edf4ff;
        --muted: #c7d8f9;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #071b44 0%, #0d2d73 100%);
        color: var(--white);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 14px 40px;
      }

      .page {
        width: min(100%, 860px);
      }

      .topbar {
        text-align: center;
        margin-bottom: 18px;
      }

      .title {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.04em;
      }

      .subtitle {
        margin: 8px 0 0;
        font-size: 1rem;
        color: var(--soft);
      }

      .panel {
        background: rgba(7, 22, 56, 0.78);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 18px 18px 20px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.28);
      }

      .canvas-wrap {
        width: min(100%, 620px);
        margin: 0 auto 18px;
        border-radius: 12px;
        overflow: hidden;
        background: #071b44;
        border: 1px solid rgba(255,255,255,0.18);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
      }

      .controls {
        display: grid;
        gap: 12px;
      }

      label {
        display: block;
        font-weight: 700;
        color: var(--soft);
        margin-bottom: -4px;
      }

      input[type="file"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.94);
        color: #19274e;
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(180deg, var(--orange) 0%, var(--orange-strong) 100%);
        color: var(--white);
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover { filter: brightness(1.05); }
      button:active { transform: translateY(1px); }
      button[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .status {
        min-height: 1.3em;
        margin: 0;
        color: #ffe39a;
        font-size: 0.95rem;
      }

      .hint {
        margin: 0;
        font-size: 0.88rem;
        color: var(--muted);
      }

      @media (max-width: 560px) {
        .panel { padding: 14px; }
        .canvas-wrap { margin-bottom: 14px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <h1 class="title">Youth Anniversary 2026</h1>
        <p class="subtitle">Create your “I Will Be Attending” badge</p>
      </div>

      <section class="panel">
        <div class="canvas-wrap">
          <canvas id="badgeCanvas" width="1024" height="1024" aria-label="Badge preview"></canvas>
        </div>

        <div class="controls">
          <div>
            <label for="photoInput">Upload your photo</label>
          </div>
          <input id="photoInput" type="file" accept="image/*" />
          <button id="downloadBtn" type="button" disabled>Download My Badge</button>
          <p class="hint">Your photo stays in your browser and is not uploaded to any server.</p>
          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById('badgeCanvas');
      const ctx = canvas.getContext('2d');
      const photoInput = document.getElementById('photoInput');
      const downloadBtn = document.getElementById('downloadBtn');
      const statusEl = document.getElementById('status');

      const poster = new Image();
      poster.src = 'poster.svg';
      let uploadedImage = null;

      function drawBackgroundImage(img, x, y, w, h) {
        const scale = Math.max(w / img.width, h / img.height);
        const drawW = img.width * scale;
        const drawH = img.height * scale;
        const drawX = x + (w - drawW) / 2;
        const drawY = y + (h - drawH) / 2;
        ctx.drawImage(img, drawX, drawY, drawW, drawH);
      }

      function drawRoundedImage(img, x, y, w, h, radius) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.clip();
        drawBackgroundImage(img, x, y, w, h);
        ctx.restore();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        ctx.stroke();
      }

      function drawBadge() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (poster.complete && poster.width > 0) {
          ctx.drawImage(poster, 0, 0, canvas.width, canvas.height);
        } else {
          const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
          gradient.addColorStop(0, '#0a1f50');
          gradient.addColorStop(1, '#0d3f95');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (uploadedImage) {
          const photoX = 314;
          const photoY = 94;
          const photoSize = 408;
          drawRoundedImage(uploadedImage, photoX, photoY, photoSize, photoSize, 28);

          ctx.fillStyle = 'rgba(8, 36, 85, 0.82)';
          ctx.fillRect(180, 520, 664, 96);

          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.font = '900 48px Arial';
          ctx.fillText('I WILL BE ATTENDING', 512, 582);
        }
      }

      poster.onload = drawBadge;
      drawBadge();

      photoInput.addEventListener('change', function (event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          statusEl.textContent = 'Please choose a valid image file.';
          return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            uploadedImage = img;
            drawBadge();
            downloadBtn.disabled = false;
            statusEl.textContent = 'Your badge is ready to download.';
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      downloadBtn.addEventListener('click', function () {
        const link = document.createElement('a');
        link.download = 'youth-anniversary-badge.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    </script>
  </body>
</html>
