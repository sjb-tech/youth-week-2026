<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youth Anniversary 2026 | I Will Be Attending</title>
    <meta name="description" content="Youth Anniversary 2026 attendance badge generator." />
    <style>
      :root { --orange: #f58220; --blue: #071d50; --soft: #edf4ff; --muted: #c7d8f9; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { font-family: Arial, Helvetica, sans-serif; background: linear-gradient(180deg, #071b44, #0d2d73); color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 28px 14px 40px; }
      .page { width: min(100%, 860px); }
      .topbar { text-align: center; margin-bottom: 18px; }
      h1 { margin: 0; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: .04em; }
      .subtitle { margin: 8px 0 0; color: var(--soft); }
      .panel { background: rgba(7,22,56,.8); border: 1px solid #ffffff26; border-radius: 18px; padding: 18px; box-shadow: 0 18px 40px #00000047; }
      .canvas-wrap { width: min(100%, 620px); margin: 0 auto 18px; border-radius: 12px; overflow: hidden; background: #071b44; border: 1px solid #ffffff2e; }
      canvas { display: block; width: 100%; height: auto; }
      .controls { display: grid; gap: 12px; }
      label { display: block; font-weight: 700; color: var(--soft); }
      input[type=file] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #ffffff33; background: #fffffff2; color: #19274e; font-size: 1rem; }
      button { border: 0; border-radius: 10px; padding: 14px 18px; font-size: 1rem; font-weight: 700; cursor: pointer; background: linear-gradient(#f59b2b, #f16523); color: #fff; }
      button:hover { filter: brightness(1.06); } button[disabled] { opacity: .55; cursor: not-allowed; }
      .status { min-height: 1.3em; margin: 0; color: #ffe39a; font-size: .95rem; }
      .hint { margin: 0; font-size: .88rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar"><h1>Youth Anniversary 2026</h1><p class="subtitle">Create your “I Will Be Attending” badge</p></div>
      <section class="panel">
        <div class="canvas-wrap"><canvas id="badgeCanvas" width="1024" height="1024" aria-label="Badge preview"></canvas></div>
        <div class="controls">
          <label for="photoInput">Upload your photo</label>
          <input id="photoInput" type="file" accept="image/*" />
          <button id="downloadBtn" type="button" disabled>Download My Badge</button>
          <p class="hint">Your photo stays in your browser and is not uploaded to a server.</p>
          <p id="status" class="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <script>
      const canvas = document.getElementById('badgeCanvas');
      const ctx = canvas.getContext('2d');
      const photoInput = document.getElementById('photoInput');
      const downloadBtn = document.getElementById('downloadBtn');
      const statusEl = document.getElementById('status');
      const poster = new Image();
      poster.src = 'poster.svg';
      let uploadedImage = null;

      function cover(img, x, y, w, h) {
        const scale = Math.max(w / img.width, h / img.height);
        const dw = img.width * scale, dh = img.height * scale;
        ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
      }

      function drawPhotoBadge(img) {
        // Portrait badge placed in the open upper-right area, preserving the flyer title.
        const cx = 850, cy = 205, radius = 104;
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.clip();
        cover(img, cx - radius, cy - radius, radius * 2, radius * 2);
        ctx.restore();
        ctx.beginPath(); ctx.arc(cx, cy, radius + 9, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 18; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, radius + 18, 0, Math.PI * 2);
        ctx.strokeStyle = '#f58220'; ctx.lineWidth = 14; ctx.stroke();
      }

      function drawAttendanceRibbon() {
        // Orange/cream treatment mirrors the flyer’s date and activity panels.
        const x = 92, y = 625, w = 840, h = 92;
        ctx.save();
        ctx.shadowColor = '#00133599'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 7;
        ctx.fillStyle = '#f58220'; ctx.fillRect(x, y, w, h);
        ctx.shadowColor = 'transparent';
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '900 52px Arial'; ctx.fillText('I WILL BE ATTENDING', 512, y + h / 2 + 2);
        ctx.restore();
      }

      function drawBadge() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (poster.complete && poster.naturalWidth) ctx.drawImage(poster, 0, 0, canvas.width, canvas.height);
        else { ctx.fillStyle = '#0d3f95'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        if (uploadedImage) { drawPhotoBadge(uploadedImage); drawAttendanceRibbon(); }
      }

      poster.onload = drawBadge;
      drawBadge();

      photoInput.addEventListener('change', event => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { statusEl.textContent = 'Please choose a valid image file.'; return; }
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => { uploadedImage = img; drawBadge(); downloadBtn.disabled = false; statusEl.textContent = 'Your badge is ready to download.'; };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'youth-anniversary-i-will-be-attending.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    </script>
  </body>
</html>
